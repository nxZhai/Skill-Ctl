<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390"
     role="img" aria-labelledby="title desc">
  <title id="title">How Skillctl moves a skill</title>
  <desc id="desc">Four steps show Skillctl adding a source, discovering SKILL.md files, indexing them in SQLite, and exposing selected skills through managed symlinks.</desc>

  <rect width="1200" height="390" rx="28" fill="#17191F"/>
  <path d="M56 64H1144" stroke="#343741" stroke-width="2"/>
  <text x="56" y="42" fill="#F2C94C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">THE LOCAL SKILL PIPELINE</text>
  <text x="1144" y="42" text-anchor="end" fill="#AAB2C1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">source → inventory → activation</text>

  <g transform="translate(50 94)">
    <rect width="240" height="196" rx="18" fill="#202228" stroke="#3C6F6A" stroke-width="2"/>
    <text x="24" y="34" fill="#41B3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">01 / ADD</text>
    <text x="24" y="82" fill="#F3EFE7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="750">Choose a source</text>
    <text x="24" y="119" fill="#AAB2C1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Git repo or local folder</text>
    <path d="M24 154H92" stroke="#41B3A3" stroke-width="5" stroke-linecap="round"/>
    <circle cx="108" cy="154" r="5" fill="#F2C94C"/>
  </g>

  <g transform="translate(332 94)">
    <rect width="240" height="196" rx="18" fill="#202228" stroke="#7D6724" stroke-width="2"/>
    <text x="24" y="34" fill="#F2C94C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">02 / SCAN</text>
    <text x="24" y="82" fill="#F3EFE7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="750">Find each skill</text>
    <text x="24" y="119" fill="#AAB2C1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">SKILL.md → metadata</text>
    <path d="M24 154H92" stroke="#F2C94C" stroke-width="5" stroke-linecap="round"/>
    <circle cx="108" cy="154" r="5" fill="#41B3A3"/>
  </g>

  <g transform="translate(614 94)">
    <rect width="240" height="196" rx="18" fill="#202228" stroke="#4B505D" stroke-width="2"/>
    <text x="24" y="34" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">03 / INDEX</text>
    <text x="24" y="82" fill="#F3EFE7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="750">Browse in SQLite</text>
    <text x="24" y="119" fill="#AAB2C1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">search · tags · notes</text>
    <path d="M24 154H92" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="108" cy="154" r="5" fill="#F2C94C"/>
  </g>

  <g transform="translate(896 94)">
    <rect width="240" height="196" rx="18" fill="#202228" stroke="#3C6F6A" stroke-width="2"/>
    <text x="24" y="34" fill="#41B3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">04 / ENABLE</text>
    <text x="24" y="82" fill="#F3EFE7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="750">Expose by link</text>
    <text x="24" y="119" fill="#AAB2C1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">global or project scope</text>
    <path d="M24 154H92" stroke="#41B3A3" stroke-width="5" stroke-linecap="round"/>
    <circle cx="108" cy="154" r="5" fill="#F2C94C"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M294 192H322" stroke="#41B3A3" stroke-width="3"/>
    <path d="M313 183L323 192L313 201" stroke="#41B3A3" stroke-width="3"/>
    <path d="M576 192H604" stroke="#F2C94C" stroke-width="3"/>
    <path d="M595 183L605 192L595 201" stroke="#F2C94C" stroke-width="3"/>
    <path d="M858 192H886" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M877 183L887 192L877 201" stroke="#CBD5E1" stroke-width="3"/>
  </g>

  <text x="56" y="348" fill="#AAB2C1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">One local inventory for the skills your agents can actually see.</text>
  <text x="1144" y="348" text-anchor="end" fill="#F2C94C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">&gt; skillctl doctor</text>
</svg>
