<svg width="640" height="220" viewBox="0 0 640 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skillctl logo</title>
  <desc id="desc">A local skill control logo with connected repository nodes and a terminal prompt.</desc>
  <defs>
    <linearGradient id="markGradient" x1="72" y1="36" x2="206" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#41B3A3"/>
      <stop offset="1" stop-color="#324A5F"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="70" y1="80" x2="206" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#41B3A3"/>
    </linearGradient>
    <filter id="shadow" x="35" y="22" width="208" height="184" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#20313A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="58" y="42" width="154" height="136" rx="30" fill="url(#markGradient)"/>
    <rect x="74" y="58" width="122" height="104" rx="22" fill="#F7FBFA" fill-opacity="0.94"/>
    <path d="M96 98L119 83L142 98L165 83" stroke="url(#lineGradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 125L119 140L142 125L165 140" stroke="#324A5F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="96" cy="98" r="10" fill="#41B3A3"/>
    <circle cx="119" cy="83" r="10" fill="#F2C94C"/>
    <circle cx="142" cy="98" r="10" fill="#41B3A3"/>
    <circle cx="165" cy="83" r="10" fill="#F2C94C"/>
    <circle cx="96" cy="125" r="10" fill="#324A5F"/>
    <circle cx="119" cy="140" r="10" fill="#41B3A3"/>
    <circle cx="142" cy="125" r="10" fill="#324A5F"/>
    <circle cx="165" cy="140" r="10" fill="#41B3A3"/>
    <path d="M87 72H119" stroke="#324A5F" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g>
    <text x="260" y="102" fill="#26343D" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="0">Skillctl</text>
    <text x="263" y="144" fill="#5B6575" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="500" letter-spacing="0">&gt; skillctl ui</text>
    <rect x="260" y="163" width="238" height="6" rx="3" fill="#41B3A3"/>
    <rect x="508" y="163" width="44" height="6" rx="3" fill="#F2C94C"/>
  </g>
</svg>
